<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Sorting Algorithm Performance Analyzer">
  <defs>
    <!-- Main gradient: blue to purple -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Bar gradient: cyan to blue to purple -->
    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="barGrad3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="barGrad4" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle inner glow for bars -->
    <filter id="barGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip to rounded rect -->
    <clipPath id="roundClip">
      <rect width="64" height="64" rx="14"/>
    </clipPath>
  </defs>

  <!-- Background: dark rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>

  <!-- Subtle grid lines (very faint) -->
  <g opacity="0.06" stroke="#7C3AED" stroke-width="0.5" clip-path="url(#roundClip)">
    <line x1="0" y1="16" x2="64" y2="16"/>
    <line x1="0" y1="32" x2="64" y2="32"/>
    <line x1="0" y1="48" x2="64" y2="48"/>
    <line x1="16" y1="0" x2="16" y2="64"/>
    <line x1="32" y1="0" x2="32" y2="64"/>
    <line x1="48" y1="0" x2="48" y2="64"/>
  </g>

  <!-- Sorting bars — ascending left to right, bottom-aligned -->
  <!-- Bar 1 (shortest) -->
  <rect x="9" y="42" width="8" height="14" rx="2" fill="url(#barGrad1)" filter="url(#barGlow)"/>

  <!-- Bar 2 -->
  <rect x="20" y="34" width="8" height="22" rx="2" fill="url(#barGrad2)" filter="url(#barGlow)"/>

  <!-- Bar 3 -->
  <rect x="31" y="24" width="8" height="32" rx="2" fill="url(#barGrad3)" filter="url(#barGlow)"/>

  <!-- Bar 4 (tallest) -->
  <rect x="42" y="14" width="8" height="42" rx="2" fill="url(#barGrad4)" filter="url(#barGlow)"/>

  <!-- Performance curve line over bars (analytics overlay) -->
  <path d="M 13 42 Q 24 30 35 20 T 46 10" 
        fill="none" 
        stroke="#06B6D4" 
        stroke-width="1.8" 
        stroke-linecap="round"
        opacity="0.85"
        filter="url(#glow)"/>

  <!-- Dot at peak of curve -->
  <circle cx="46" cy="10" r="2.2" fill="#06B6D4" opacity="0.95" filter="url(#glow)"/>

  <!-- Subtle top highlight (glassmorphism edge) -->
  <rect width="64" height="64" rx="14" 
        fill="none" 
        stroke="rgba(255,255,255,0.08)" 
        stroke-width="1"/>
</svg>
